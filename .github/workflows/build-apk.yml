name: Build lollipop APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q -O "$RUNNER_TEMP/commandlinetools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -storepass manus-release \
            -keypass manus-release \
            -alias lollipop \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=lollipop, OU=Build, O=Manus, L=NA, ST=NA, C=US"

      - name: Build optimized release APK
        uses: gradle/gradle-build-action@v3
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: manus-release
          KEY_ALIAS: lollipop
          KEY_PASSWORD: manus-release
        with:
          arguments: assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lollipop-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
